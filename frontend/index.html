<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Spectator</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <h1>Game Spectator</h1>
  <div id="code-display"></div>
  <div id="state-display" class="disconnected">Connecting...</div>
  <div id="timer" class="hidden"></div>
  <div id="player-count"></div>
  <canvas id="world" class="hidden" width="400" height="400"></canvas>
  <div id="join-info" class="hidden">
    <div>Players connect using the code above</div>
    <div id="join-code"></div>
  </div>
</div>
<div id="connection-status" class="disconnected">disconnected</div>

<script src="app.js"></script>
</body>
</html>
